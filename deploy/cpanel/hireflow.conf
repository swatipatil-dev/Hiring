# HireFlow — Apache vhost include for career.innomaxskills.com
#
# Install into BOTH the plain and SSL userdata paths so it survives a vhost
# rebuild (cPanel regenerates httpd.conf; anything edited there directly is lost):
#
#   mkdir -p /etc/apache2/conf.d/userdata/std/2_4/innomaxskills/career.innomaxskills.com
#   mkdir -p /etc/apache2/conf.d/userdata/ssl/2_4/innomaxskills/career.innomaxskills.com
#   cp deploy/cpanel/hireflow.conf \
#      /etc/apache2/conf.d/userdata/std/2_4/innomaxskills/career.innomaxskills.com/
#   cp deploy/cpanel/hireflow.conf \
#      /etc/apache2/conf.d/userdata/ssl/2_4/innomaxskills/career.innomaxskills.com/
#   /scripts/ensure_vhost_includes --user=innomaxskills
#   /scripts/restartsrv_httpd
#
# Required EasyApache 4 modules (mod_proxy_wstunnel is NOT in the default profile):
#   yum install ea-apache24-mod_proxy ea-apache24-mod_proxy_http \
#               ea-apache24-mod_proxy_wstunnel
#
# If SELinux is enforcing, Apache cannot open a local socket until:
#   setsebool -P httpd_can_network_connect 1
#
# Two upstreams, because proctoring must run as a single worker while the API
# runs several — see deploy/cpanel/hireflow-proctor.service for why.
#   127.0.0.1:8000  hireflow-api      (3 workers)
#   127.0.0.1:8001  hireflow-proctor  (1 worker)

# The backend resolves the tenant from the Host header (src/middleware/tenant_domain.py).
# Without this Apache rewrites Host to 127.0.0.1:800x and multi-tenant resolution breaks.
ProxyPreserveHost On

# Long-lived upstreams: question generation runs up to 300s (gemini_service.py),
# and proctoring WebSockets stay open for the length of a test.
ProxyTimeout 3600

# Total request body cap. Apache rejects an oversized body with 413 BEFORE the request
# reaches FastAPI, so the API cannot explain what went wrong — the browser just sees a
# bare 413. That made bulk resume upload fail opaquely: the per-file limit is 5 MB
# (validate_file_upload), so the inherited 25m ceiling was reached by only five
# full-size PDFs, well under the 20-file batch the API advertises.
#
# The Talent Pool now uploads in size-bounded chunks (~16 MiB, see MATCH_CHUNK_BYTES in
# frontend/src/pages/hr/ResumeMatcher.jsx), so this is headroom rather than the thing
# being relied on. Keep it comfortably above one chunk; raising it further does not
# raise how much can be uploaded, only how much arrives at once.
LimitRequestBody 67108864

# Do not proxy the SPA's own static assets.
ProxyPass /assets !

# ── WebSockets ───────────────────────────────────────────────────────────────
#
# These MUST be ProxyPass entries with the ws:// scheme, not RewriteRule [P].
#
# Apache evaluates ProxyPass BEFORE mod_rewrite's [P] flag — the precedence is
# between modules, not line order. So for a path covered by both, ProxyPass wins,
# the Upgrade request is forwarded by mod_proxy_http as ordinary HTTP, the
# handshake fails, and the browser closes with 1006. mod_proxy_wstunnel stays
# loaded but never invoked. That is exactly what broke proctoring on first
# deployment: the badge sat on "Checking..." forever because zero frames were
# ever analysed, which also meant no evidence and a "clean" result.
#
# A ws:// target routes through mod_proxy_wstunnel regardless of rewrite
# precedence. These are declared BEFORE the general HTTP ProxyPass for the same
# prefix, because ProxyPass matches longest-prefix-first in declaration order.
#
# Paths are exact — see routes.py:654-656 and the @router.websocket decorators.
ProxyPass        /api/v1/proctor/ws/ ws://127.0.0.1:8001/api/v1/proctor/ws/
ProxyPassReverse /api/v1/proctor/ws/ ws://127.0.0.1:8001/api/v1/proctor/ws/
ProxyPass        /api/v1/judge/ws/   ws://127.0.0.1:8000/api/v1/judge/ws/
ProxyPassReverse /api/v1/judge/ws/   ws://127.0.0.1:8000/api/v1/judge/ws/

# Fallback for any WebSocket path NOT covered by a prefix above (e.g. a route
# added later). Kept deliberately alongside the ProxyPass entries — it is not
# redundant, it is the safety net for paths nobody remembered to add here. It
# only fires for requests the ProxyPass rules did not already claim.
RewriteEngine On

RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/api/v1/proctor/(.*)$ ws://127.0.0.1:8001/api/v1/proctor/$1 [P,L]

RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/proctor/(.*)$ ws://127.0.0.1:8001/proctor/$1 [P,L]

RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/api/v1/judge/(.*)$ ws://127.0.0.1:8000/api/v1/judge/$1 [P,L]

# ── Proctoring HTTP → the single-worker proctor service ──────────────────────
# More specific than /api/, so it must be declared first.
ProxyPass        /api/v1/proctor/ http://127.0.0.1:8001/api/v1/proctor/
ProxyPassReverse /api/v1/proctor/ http://127.0.0.1:8001/api/v1/proctor/
ProxyPass        /proctor/        http://127.0.0.1:8001/proctor/
ProxyPassReverse /proctor/        http://127.0.0.1:8001/proctor/
ProxyPass        /proctor         http://127.0.0.1:8001/proctor
ProxyPassReverse /proctor         http://127.0.0.1:8001/proctor

# ── Everything else → the API ────────────────────────────────────────────────
ProxyPass        /api/         http://127.0.0.1:8000/api/
ProxyPassReverse /api/         http://127.0.0.1:8000/api/
ProxyPass        /interviews/  http://127.0.0.1:8000/interviews/
ProxyPassReverse /interviews/  http://127.0.0.1:8000/interviews/
ProxyPass        /mcq/         http://127.0.0.1:8000/mcq/
ProxyPassReverse /mcq/         http://127.0.0.1:8000/mcq/

# Company logos: the only uploaded files that are public. Served THROUGH the app,
# not from disk, so Apache needs no read access to the upload tree and
# STORAGE_BACKEND stays swappable.
#
# Resumes, cover letters, photos and voice answers are private and are downloaded
# only through the authenticated /api/v1/files/* routes above. Do not add
# /uploads/, /resumes/ or /cover_letters/ back: they used to be proxied to public
# static mounts that served any candidate's files to anyone holding the path.
ProxyPass        /logos/         http://127.0.0.1:8000/logos/
ProxyPassReverse /logos/         http://127.0.0.1:8000/logos/

# Health and API docs.
ProxyPass        /health       http://127.0.0.1:8000/health
ProxyPassReverse /health       http://127.0.0.1:8000/health
ProxyPass        /docs         http://127.0.0.1:8000/docs
ProxyPassReverse /docs         http://127.0.0.1:8000/docs
ProxyPass        /redoc        http://127.0.0.1:8000/redoc
ProxyPassReverse /redoc        http://127.0.0.1:8000/redoc
ProxyPass        /openapi.json http://127.0.0.1:8000/openapi.json
ProxyPassReverse /openapi.json http://127.0.0.1:8000/openapi.json

# Everything not matched above falls through to the document root, where the
# SPA's .htaccess handles history fallback.
