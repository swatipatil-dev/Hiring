name: Deploy to cPanel

# Auto-deploy is PAUSED. `on: push` is deliberately absent.
#
# The six repository secrets in docs/CICD_SETUP.md section 4 were never created,
# so the first run this workflow ever had — the merge to main on 2026-09-07 —
# could only fail. It failed obscurely: DEPLOY_HOST expanded to nothing, ssh fell
# back to resolving the literal alias `target`, and the visible error was a DNS
# failure inside the ROLLBACK step, a hundred lines past the actual cause.
#
# Until those secrets exist, a deploy is a deliberate button press. To restore
# automatic release-on-merge, add back:
#
#   push:
#     branches: [main]
#
# and see docs/CICD_SETUP.md, "Auto-deploy is paused", for the full checklist.
#
# This automates docs/DEPLOY_UPDATE.md step for step, including its conditionals
# — git pull leaves four things stale (database, systemd units, Apache config,
# built frontend) and each of those has an incident behind it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the commands without changing anything'
        type: boolean
        default: false

# GITHUB_TOKEN gets read-only access. Without an explicit block a workflow inherits
# the repository default, which is commonly read/write — and this one only ever reads
# the checkout. release.yml is the single workflow here that needs `contents: write`.
permissions:
  contents: read

# Never let two deploys overlap. Not cancel-in-progress: interrupting a deploy
# halfway is worse than queueing behind one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/hireflow
  WEB_ROOT: /home/innomaxskills/public_html/career
  SERVICES: hireflow-api hireflow-proctor hireflow-judge-worker hireflow-email-worker

jobs:
  # ── Build the release ───────────────────────────────────────────────────────
  # The frontend is built HERE, never on the server. docs/DEPLOY_UPDATE.md:139
  # requires `npm install` over `npm ci` because the lockfile drifts — but
  # `npm install` rewrites the tracked package-lock.json, so on the server it
  # dirties the tree and the NEXT `git pull` conflicts mid-deploy.
  #
  # Safe to build here because dist/ is environment-independent: client.js uses a
  # relative baseURL and there are no VITE_ build variables.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://career.innomaxskills.com
    steps:
      # This is now the ONLY branch enforcement in the workflow. With `on: push`
      # removed every run is a workflow_dispatch, and the Actions "Run workflow"
      # dropdown lets you pick ANY branch — while the approving reviewer sees a
      # deploy request, not a branch name. Without this, shipping develop to the
      # live site is two clicks. It refuses tags too (github.ref is refs/tags/*).
      #
      # Belt and braces: the `production` environment should also carry a
      # deployment branch rule limited to `main`, which refuses BEFORE a reviewer
      # is prompted. See docs/CICD_SETUP.md section 5.
      #
      # develop and testing are CI-only by design — there is one server, so
      # deploying them would replace production. See docs/CICD_SETUP.md.
      - name: Only main reaches production
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy from '${{ github.ref_name }}'. Production deploys only from main."
            exit 1
          fi
          echo "Deploying ${{ github.sha }} from main."

      # The obscure-failure fix. On the first run this workflow ever had, none of
      # the six secrets below existed; the visible symptom was
      # "ssh: Could not resolve hostname target" reported from the ROLLBACK step,
      # a hundred lines past the cause. Name what is missing, here, before
      # anything touches the server.
      #
      # This cannot be an `if:`. `secrets` is not among the contexts available to
      # a step-level `if:` (nor a job-level one), so the values have to be mapped
      # into `env` and tested by the shell. Only NAMES are ever printed.
      - name: Every deploy secret is present
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DEPLOY_SSH_KEY:-}" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "${DEPLOY_HOST:-}"    ] || missing="$missing DEPLOY_HOST"
          [ -n "${DEPLOY_USER:-}"    ] || missing="$missing DEPLOY_USER"
          [ -n "${DB_NAME:-}"        ] || missing="$missing DB_NAME"
          [ -n "${DB_USER:-}"        ] || missing="$missing DB_USER"
          [ -n "${DB_PASSWORD:-}"    ] || missing="$missing DB_PASSWORD"

          if [ -n "$missing" ]; then
            echo "::error::Deploy secrets are not configured. Missing:$missing"
            echo "::error::Add them at Settings -> Secrets and variables -> Actions."
            echo "::error::The values, and how to generate the key pair, are in docs/CICD_SETUP.md section 4."
            echo "::error::Nothing has been changed on the server."
            exit 1
          fi

          # A public key pasted where the private one belongs passes the
          # emptiness check and then fails at ssh — the most common way to get
          # this wrong once the secrets do exist.
          case "$DEPLOY_SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) ;;
            *)
              echo "::error::DEPLOY_SSH_KEY is set but does not look like a private key."
              echo "::error::Paste the whole private key file including its BEGIN/END lines — not the .pub half."
              exit 1
              ;;
          esac

          echo "All six deploy secrets are present."

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # Defines the `target` alias every later step uses, so host, user and key
      # are written once rather than repeated fifteen times.
      - name: Open an SSH session
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # printf via env, not `echo "${{ secrets.* }}"`: the latter splices the
          # key body into the generated script text, so a quote or backslash in
          # the key corrupts the script rather than the key.
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # ssh-keyscan's exit code on an unreachable host is not consistent
          # across OpenSSH versions, and -H hashes the hostname so known_hosts
          # cannot be grepped for it afterwards. Check the output instead: an
          # empty keyscan silently yields a config that fails host-key
          # verification several steps later.
          KEYS=$(ssh-keyscan -H "$DEPLOY_HOST" 2>/dev/null || true)
          if [ -z "$KEYS" ]; then
            echo "::error::ssh-keyscan returned no host key for the deploy host."
            echo "::error::Is it up, and is port 22 reachable from GitHub's runner ranges?"
            exit 1
          fi
          printf '%s\n' "$KEYS" >> ~/.ssh/known_hosts

          # `>` not `>>`: appending would stack duplicate `Host target` blocks if
          # this step ever ran twice in one job.
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
          CFG
          chmod 600 ~/.ssh/config

      # Step 1 — pull, and let the diff decide what else has to happen.
      - name: Pull and compute the change set
        id: pull
        run: |
          # An empty BEFORE used to be written to $GITHUB_OUTPUT and the step
          # carried on into `git pull` — leaving a deploy running with no
          # rollback point. Stop here instead, while the server is untouched.
          BEFORE=$(ssh target "cd $APP_DIR && git rev-parse HEAD")
          if [ -z "$BEFORE" ]; then
            echo "::error::Could not read the current commit on the server."
            echo "::error::Aborting before anything changes — there would be no rollback point."
            exit 1
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "Rolling back to $BEFORE if anything fails."

          ${{ inputs.dry_run && 'echo DRY-RUN would:' || '' }} \
            ssh target "cd $APP_DIR && git pull --ff-only"

          CHANGED=$(ssh target "cd $APP_DIR && git diff --name-only $BEFORE HEAD")
          echo "$CHANGED"
          grep -q '^backend/alembic/versions/'   <<<"$CHANGED" && echo "migrations=true" >> "$GITHUB_OUTPUT" || true
          grep -q '^backend/requirements-cpanel' <<<"$CHANGED" && echo "deps=true"       >> "$GITHUB_OUTPUT" || true
          grep -qE '^deploy/cpanel/.*\.(service|timer)$' <<<"$CHANGED" && echo "units=true" >> "$GITHUB_OUTPUT" || true
          grep -q '^deploy/cpanel/hireflow.conf' <<<"$CHANGED" && echo "apache=true"     >> "$GITHUB_OUTPUT" || true
          grep -q '^frontend/'                   <<<"$CHANGED" && echo "frontend=true"   >> "$GITHUB_OUTPUT" || true

      # Step 2 — back up before any migration. A dump with zero CREATE TABLE
      # lines is not a backup; the runbook says stop if the count is 0.
      - name: Back up the database
        if: steps.pull.outputs.migrations == 'true' && !inputs.dry_run
        run: |
          ssh target "sudo mysqldump -u '${{ secrets.DB_USER }}' -p'${{ secrets.DB_PASSWORD }}' \
            --single-transaction --no-tablespaces '${{ secrets.DB_NAME }}' \
            > /root/predeploy-\$(date +%F-%H%M).sql"
          TABLES=$(ssh target "grep -c '^CREATE TABLE' \$(ls -t /root/predeploy-*.sql | head -1)")
          echo "tables in dump: $TABLES"
          [ "$TABLES" -gt 0 ] || { echo "::error::Backup contains no tables — refusing to migrate."; exit 1; }

      - name: Install Python dependencies
        if: steps.pull.outputs.deps == 'true' && !inputs.dry_run
        run: |
          ssh target "sudo -u hireflow $APP_DIR/venv/bin/pip install -r $APP_DIR/backend/requirements-cpanel.txt"

      # Fail fast, before services are touched: exits non-zero if a required
      # model cannot be fetched. Missing from DEPLOY_UPDATE.md but present in the
      # install runbook, and it belongs here.
      - name: Prefetch ML models
        if: steps.pull.outputs.deps == 'true' && !inputs.dry_run
        run: |
          ssh target "cd $APP_DIR/backend && sudo -u hireflow HF_HOME=$APP_DIR/hf-cache \
            $APP_DIR/venv/bin/python scripts/prefetch_models.py"

      # Step 4 — THE GATE. Runs on every deploy, migrations changed or not,
      # because a database can be stamped at head while missing a column. Nothing
      # below this line runs if it fails, and no service has been restarted yet.
      - name: Migrate and verify the schema
        if: ${{ !inputs.dry_run }}
        run: |
          ssh target "cd $APP_DIR/backend && sudo -u hireflow $APP_DIR/venv/bin/alembic upgrade head"
          ssh target "cd $APP_DIR/backend && sudo -u hireflow $APP_DIR/venv/bin/alembic current"
          ssh target "cd $APP_DIR/backend && sudo -u hireflow $APP_DIR/venv/bin/python scripts/schema_diff.py"

      - name: Update systemd units
        if: steps.pull.outputs.units == 'true' && !inputs.dry_run
        run: |
          ssh target "sudo cp -f $APP_DIR/deploy/cpanel/*.service /etc/systemd/system/"
          ssh target "sudo cp -f $APP_DIR/deploy/cpanel/*.timer /etc/systemd/system/ 2>/dev/null || true"
          ssh target "sudo systemctl daemon-reload"

      # Both std and ssl — cPanel rebuilds its own configuration and needs both.
      - name: Update the Apache vhost include
        if: steps.pull.outputs.apache == 'true' && !inputs.dry_run
        run: |
          ssh target "for m in std ssl; do sudo cp -f $APP_DIR/deploy/cpanel/hireflow.conf \
            /etc/apache2/conf.d/userdata/\$m/2_4/innomaxskills/career.innomaxskills.com/; done"
          ssh target "sudo /scripts/ensure_vhost_includes --user=innomaxskills"
          ssh target "sudo /scripts/restartsrv_httpd"

      # .htaccess is copied AFTER the rsync: --delete would otherwise remove it
      # and every deep link would 404. Order matters here.
      - name: Publish the frontend
        id: publish
        if: steps.pull.outputs.frontend == 'true' && !inputs.dry_run
        run: |
          rsync -az --delete -e "ssh -F ~/.ssh/config" dist/ target:/tmp/hireflow-dist/
          ssh target "sudo rsync -a --delete /tmp/hireflow-dist/ $WEB_ROOT/"
          ssh target "sudo cp -f $APP_DIR/deploy/cpanel/htaccess-spa $WEB_ROOT/.htaccess"
          ssh target "sudo chown -R innomaxskills:innomaxskills $WEB_ROOT"

      - name: Restart services and verify
        if: ${{ !inputs.dry_run }}
        run: |
          ssh target "sudo systemctl restart $SERVICES"
          sleep 25
          ssh target "systemctl is-active $SERVICES"
          HEALTH=$(ssh target "curl -sf localhost:8000/health")
          echo "$HEALTH"
          grep -q '"status":"healthy"' <<<"$HEALTH" \
            || { echo "::error::Health check failed after restart."; exit 1; }

      # The rollback needs the bundle that WAS serving, and nothing on the server
      # otherwise remembers it: the docroot is about to be overwritten, and the deploy
      # user cannot read it back — it is innomaxskills-owned, and the single root rsync
      # in deploy-sudoers only writes INTO the docroot, never out of it.
      #
      # So keep a copy, and write it only here: after the health check, so a bundle is
      # promoted to "known good" only by a deploy that actually worked. During a failed
      # deploy this therefore still holds the PREVIOUS good bundle, which is exactly
      # what the rollback below needs.
      #
      # $APP_DIR rather than /tmp: the deploy user can write it without sudo (it is in
      # the hireflow group and CICD_SETUP.md section 1 does `chmod -R g+rwX`), and it
      # survives a reboot. It is untracked, so it blocks neither `git pull --ff-only`
      # nor `git reset --hard` — neither of those touches untracked files.
      - name: Record the published bundle as the rollback point
        if: success() && steps.publish.outcome == 'success' && !inputs.dry_run
        run: |
          ssh target "rsync -a --delete /tmp/hireflow-dist/ $APP_DIR/.dist-prev/"
          echo "Recorded this bundle as the rollback point for the next deploy."

      # Roll the CODE back, not the schema. DEPLOY_UPDATE.md:185-188 is explicit:
      # a half-applied migration is worse than a newer schema under older code,
      # which is usually harmless because migrations here are additive.
      #
      # The `before != ''` guard is not optional. With an empty SHA the reset
      # below expands to a bare `git reset --hard`, which resets to HEAD — it
      # rolls nothing back and discards any uncommitted change in the production
      # checkout. It would fire in exactly the case where the deploy died early
      # and the server was never touched, i.e. where doing nothing is correct.
      #
      # `before` IS still set when the pull step itself failed: the runner reads
      # $GITHUB_OUTPUT after a step exits regardless of its exit code. So a failed
      # `git pull` still rolls back, which is the point. The guard suppresses only
      # the case where `before` was never captured at all.
      - name: Roll back on failure
        if: failure() && steps.pull.outputs.before != '' && !inputs.dry_run
        env:
          BEFORE: ${{ steps.pull.outputs.before }}
          # 'skipped' means the frontend was never touched. 'failure' means the publish
          # died part-way, so the docroot is in a mixed state and MUST be restored —
          # which is why this tests for "not skipped" rather than "succeeded".
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          # Belt and braces behind the `if:`. GitHub casts both sides of a
          # mixed-type comparison to number, so the expression guard alone has a
          # vanishing but real hole for an all-decimal SHA. This one does not.
          case "$BEFORE" in
            *[!0-9a-f]*|"") ;;
            *) [ "${#BEFORE}" -eq 40 ] && VALID=1 ;;
          esac
          if [ "${VALID:-0}" != "1" ]; then
            echo "::error::Refusing to roll back: '$BEFORE' is not a commit SHA."
            echo "::error::A bare 'git reset --hard' would discard server-side changes, not roll back."
            exit 1
          fi

          echo "::warning::Deploy failed — rolling code back to $BEFORE"
          ssh target "cd $APP_DIR && git reset --hard '$BEFORE'"

          # Roll the frontend back too. Without this a deploy that published dist/ and
          # then failed left the browser on the NEW UI against rolled-back code — the
          # stale-copy failure DEPLOY_UPDATE.md is built around, re-created by the very
          # thing meant to prevent it. The manual runbook (DEPLOY_UPDATE.md:181) rebuilds
          # the frontend on rollback; this is the pipeline's equivalent.
          #
          # The three sudo commands are the same ones the publish step runs, so they are
          # already covered by the HF_WEB alias in deploy-sudoers — no new grant needed.
          # .htaccess is re-copied AFTER the rsync for the same reason it is there:
          # --delete would take it out and every deep link would 404.
          RESTORED="no"
          if [ "$PUBLISHED" != "skipped" ]; then
            if ssh target "[ -d $APP_DIR/.dist-prev ] && [ -n \"\$(ls -A $APP_DIR/.dist-prev 2>/dev/null)\" ]"; then
              echo "::warning::Restoring the previously published frontend"
              ssh target "rsync -a --delete $APP_DIR/.dist-prev/ /tmp/hireflow-dist/"
              ssh target "sudo rsync -a --delete /tmp/hireflow-dist/ $WEB_ROOT/"
              ssh target "sudo cp -f $APP_DIR/deploy/cpanel/htaccess-spa $WEB_ROOT/.htaccess"
              ssh target "sudo chown -R innomaxskills:innomaxskills $WEB_ROOT"
              RESTORED="yes"
            else
              # Only reachable on the first-ever deploy, or if .dist-prev was wiped.
              # Loud, because this is the one case a human has to act on right now.
              echo "::error::The new frontend is live and there is no recorded bundle to restore."
              echo "::error::The site is serving new UI against rolled-back code."
              echo "::error::Fix by hand — DEPLOY_UPDATE.md:181: build the frontend at $BEFORE"
              echo "::error::and rsync it to $WEB_ROOT."
            fi
          fi

          ssh target "sudo systemctl restart $SERVICES" || true
          sleep 20
          ssh target "curl -sf localhost:8000/health" || echo "::error::Still unhealthy after rollback — needs a human."

          # Say which of the four copies git pull does not update are now consistent,
          # rather than leaving the reader to infer it from which steps ran.
          echo "::warning::Rolled back: code -> $BEFORE; frontend restored: $RESTORED"
          echo "::warning::Schema was NOT rolled back. Dumps are in /root/predeploy-*.sql"

      # A skipped rollback on a failed deploy must not be silent — otherwise the
      # only signal is the absence of a step, and "the rollback ran" is the
      # natural assumption.
      - name: Note that no rollback was needed
        if: failure() && steps.pull.outputs.before == '' && !inputs.dry_run
        run: |
          echo "::warning::Deploy failed before a pre-deploy commit was recorded."
          echo "::warning::Nothing was changed on the server, so there is nothing to roll back."
          echo "::warning::Fix the error above and re-run; the live site is untouched."

      - name: Smoke checks a pipeline cannot do
        if: success() && !inputs.dry_run
        run: |
          echo "::notice::Deployed. Proctoring and the coding judge have NO CI coverage —"
          echo "::notice::verify by hand (DEPLOY_UPDATE.md:165-171): HR login, one real email,"
          echo "::notice::a proctoring WebSocket reaching 101, Run Code, and opening a CV."
