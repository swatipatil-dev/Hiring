name: HireFlow CI

# Label the run with the branch's role, so the Actions list says what a run means
# without opening it — "CI · main (PRODUCTION)" reads differently from
# "CI · develop (integration)".
run-name: >-
  CI · ${{ github.ref_name }} ${{
    github.ref_name == 'main' && '(PRODUCTION — deploy is manual)'
    || github.ref_name == 'testing' && '(pre-release)'
    || github.ref_name == 'develop' && '(integration)'
    || '(feature)' }}

# Branch flow:  feature -> develop -> testing -> main
#
#   feature/*  day-to-day work        CI only
#   develop    integration            CI only
#   testing    pre-release / QA       CI only
#   main       production             CI only — deploy.yml is dispatched by hand
#
# `testing` deliberately does NOT deploy: there is one server
# (career.innomaxskills.com), so deploying it would replace the live site with
# unreviewed code. See docs/CICD_SETUP.md.
#
# Push is every branch, not a fixed list. The previous trigger named `staging`
# and `develop` — neither of which existed — while missing every branch actually
# in use, so pushes to real work branches ran no CI at all.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, testing, develop]
  workflow_dispatch:

# GITHUB_TOKEN gets read-only access. Without an explicit block a workflow inherits
# the repository default, which is commonly read/write — and this one only ever reads
# the checkout. release.yml is the single workflow here that needs `contents: write`.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  # Its own job so it reports independently. Previously it ran AFTER pytest in
  # the same job, which meant a test failure hid lint entirely, and a lint
  # failure was only ever visible on an otherwise-green run.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - run: pip install flake8

      # Ignore pre-existing cosmetic style issues across the codebase
      # (whitespace, blank-line counts, comparison style, etc.) while keeping
      # checks for the things that matter: undefined names (F821), syntax
      # errors, unused imports of *names* (F-class), etc.
      - name: flake8
        run: |
          flake8 routes/ src/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,F401,W291,W293,W391,E302,E303,E305,E401,E127,E128,E123,E221,E225,E241,E711,E712,E722,E741,F811,F841,W504 \
            --exclude=src/services/ollama_service.py

  # ── Backend tests ───────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: recruitment_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB: recruitment_test_db
      DB_PASSWORD: "1234"
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-32chars-minimum!!' }}
      DATABASE_URL: mysql+pymysql://root:1234@localhost:3306/recruitment_test_db

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # The judge integration tests run real code inside hardened Docker
      # containers. ubuntu-latest HAS a Docker daemon, so docker_available() is
      # True and the skipif guards do NOT fire — meaning if an image is missing,
      # every sandboxed test fails as RE/CE rather than skipping.
      #
      # Cached on the Dockerfiles: four uncached `docker build`s on every push
      # was the dominant cost of this workflow.
      - name: Cache judge sandbox images
        id: judge-cache
        uses: actions/cache@v4
        with:
          path: /tmp/judge-images
          key: judge-images-${{ hashFiles('backend/judge/images/Dockerfile.*') }}

      - name: Load cached judge images
        if: steps.judge-cache.outputs.cache-hit == 'true'
        run: for f in /tmp/judge-images/*.tar; do docker load -i "$f"; done

      - name: Build judge sandbox images
        if: steps.judge-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build_judge_images.sh
          mkdir -p /tmp/judge-images
          # Named explicitly rather than `docker images | grep judge`, so an
          # unrelated image on the runner can never end up in the cache.
          for lang in python cpp node java; do
            docker save "hireflow-judge-$lang:latest" -o "/tmp/judge-images/$lang.tar"
          done

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysql -h 127.0.0.1 -u root -p1234 -e "SELECT 1;" 2>/dev/null && break
            echo "Waiting for MySQL... ($i)"
            sleep 3
          done
          mysql -h 127.0.0.1 -u root -p1234 -e "CREATE DATABASE IF NOT EXISTS recruitment_test_db;"

      - name: pytest
        run: pytest test/ -v --tb=short -m "not slow" --junit-xml=test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ── Migrations ──────────────────────────────────────────────────────────────
  # conftest.py builds the schema with Base.metadata.create_all, so the backend
  # job never runs a single migration — a green suite says nothing about whether
  # `alembic upgrade head` works. That gap shipped a missing column that only
  # surfaced as "Unknown column resume_pool.profile_source" against a real
  # database.
  #
  # DO NOT "simplify" this to `alembic upgrade head` on the empty service
  # database. It cannot work, and the reason is documented at
  # docs/CPANEL_DEPLOYMENT.md:702 — the first revision has no parent but its
  # first statement is `CREATE INDEX ... ON interviews`. Alembic was adopted
  # AFTER the schema already existed, so the chain only records changes since
  # then; there is no create_table for the base schema anywhere in it. On an
  # empty database it fails immediately with "Table 'interviews' doesn't exist".
  #
  # So this reproduces what a real deploy does instead:
  #   1. build the schema as `main` has it   (create_all + stamp — the documented
  #      bootstrap at CPANEL_DEPLOYMENT.md:715-745)
  #   2. apply THIS branch's new revisions on top
  #   3. check the result against the models with the same schema_diff.py gate
  #      the deploy uses
  #
  # When a branch adds no migrations, step 2 is a no-op and step 3 still runs.
  migrations:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: hireflow_migrations
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-test-secret-key-32chars-minimum!!
      DATABASE_URL: mysql+pymysql://root:1234@localhost:3306/hireflow_migrations
      # The service container already created the database. Left at its default
      # of 1, init_db() would also attempt CREATE DATABASE / CREATE USER.
      DB_BOOTSTRAP: "0"

    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Check out main (the released schema)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pr/backend/requirements-ci.txt

      - run: pip install -r pr/backend/requirements-ci.txt

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysql -h 127.0.0.1 -u root -p1234 -e "SELECT 1;" 2>/dev/null && break
            sleep 3
          done

      # Two branches each adding a migration produce two heads, which otherwise
      # only fails at merge time. Catch it on the PR instead.
      - name: Exactly one Alembic head
        working-directory: pr/backend
        run: |
          alembic heads
          heads=$(alembic heads | grep -c "(head)" || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $heads — two branches added migrations in parallel."
            exit 1
          fi

      # `import main` is load-bearing, not decorative: create_all only creates
      # tables for models that have been IMPORTED, and the judge and question
      # tables live in separate modules. Importing src.models.models alone
      # silently skips them. See CPANEL_DEPLOYMENT.md:734-738.
      - name: Build the schema as main has it
        working-directory: base/backend
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import main
          from src.config.database_config_mysql import init_db, db_manager
          ok = init_db()
          info = db_manager.get_database_info()
          print('created:', ok, '| tables:', info.get('table_count'))
          "
          alembic stamp head
          alembic current

      # The step that actually earns this job: only the revisions this branch
      # adds run here, which is exactly what happens on the server.
      - name: Apply this branch's new migrations
        working-directory: pr/backend
        run: |
          alembic upgrade head
          alembic current

      # `alembic current` is not evidence the schema is right — a database can be
      # stamped at head while missing a column, silently, until a request 500s.
      - name: Schema matches the models
        working-directory: pr/backend
        run: python scripts/schema_diff.py


  # ── Frontend ────────────────────────────────────────────────────────────────
  # New. Node was never set up in CI, so 109 vitest tests and the production
  # build were entirely unverified.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm install`, not `npm ci`: the lockfile drifts from package.json and
      # `npm ci` fails with EUSAGE (see docs/DEPLOY_UPDATE.md:139). It rewrites
      # the lockfile, which is why this must never run on the server — there it
      # dirties the tree and wedges the next `git pull`. On a disposable runner
      # checkout the rewrite is harmless.
      - run: npm install

      - name: vitest
        run: npm test

      - name: Production build
        run: npm run build
