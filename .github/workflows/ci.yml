name: HireFlow CI

run-name: >-
  CI · ${{ github.base_ref || github.ref_name }} ${{
    (github.base_ref || github.ref_name) == 'main' && '(stage 3 · PRODUCTION — green means this DEPLOYS)'
    || (github.base_ref || github.ref_name) == 'testing' && '(stage 2 · pre-release)'
    || (github.base_ref || github.ref_name) == 'develop' && '(stage 1 · integration)'
    || '(manual)' }}${{ github.event_name == 'pull_request' && ' · PR' || '' }}

# Branch flow:  feature -> develop -> testing -> main
#
# Every test runs ONCE on the way to production, and none is missed:
#
#   stage 1  develop   lint, backend (all but `slow`/`proctor`), migrations, frontend
#   stage 2  testing   backend `slow` + `proctor` tests, with the proctoring/ML extras
#   stage 3  main      no tests of its own — stages 1 and 2 must have passed on this
#                      exact code; then deploy.yml ships it
#
# The two pytest selections are exact complements, so each test belongs to one
# stage. Each stage also fails if any test was skipped without an approved reason
# (backend/scripts/ci_check_skips.py, backend/test/ci_allowed_skips.txt).
#
# How a stage is not repeated: when a stage passes, `record-*` uploads an artifact
# named ci-stage<N>-<tree>, where <tree> is `git rev-parse HEAD^{tree}` — the same
# for the same code, whatever the commit or branch. The `plan` job looks that up
# for every stage the target branch needs:
#   found   -> the stage already passed on this exact code; skipped here
#   missing -> the stage RUNS here
# So a normal release tests once (PR into develop runs stage 1; the push after the
# merge finds the marker; develop -> testing adds stage 2; testing -> main finds
# both). Anything else — a hotfix pushed straight to main, a merge whose base moved,
# an expired marker — has no marker for its tree and is tested in full. The
# fallback is always "run it", never "assume it passed".
#
# Feature-branch pushes run no CI: their code is tested on the pull request into
# develop. workflow_dispatch ignores markers and runs every stage the branch needs
# (develop: 1; testing/main and any other branch: 1 and 2).
#
# `testing` deliberately does NOT deploy: there is one server
# (career.innomaxskills.com), so deploying it would replace the live site with
# unreviewed code. See docs/CICD_SETUP.md.
on:
  push:
    branches: [develop, testing, main]
  pull_request:
    branches: [develop, testing, main]
  workflow_dispatch:

# Read-only, plus reading artifacts so `plan` can find stage markers.
# release.yml is the single workflow here that needs `contents: write`.
permissions:
  contents: read
  actions: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Which stages this run must execute ──────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      stage1: ${{ steps.plan.outputs.stage1 }}
      stage2: ${{ steps.plan.outputs.stage2 }}
    steps:
      # On a pull_request this is the merge commit GitHub builds, i.e. exactly the
      # code that lands if the PR is merged now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Plan stages
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "target branch: $TARGET   event: $EVENT   tree: $TREE"

          case "$TARGET" in
            develop)      NEED="1" ;;
            testing|main) NEED="1 2" ;;
            *)            NEED="1 2" ;;   # manual run on any other branch
          esac

          for N in 1 2; do
            RUN=false
            if [[ " $NEED " == *" $N "* ]]; then
              RUN=true
              if [ "$EVENT" != "workflow_dispatch" ]; then
                # Unexpired marker for this exact tree -> the stage already passed.
                FOUND=$(gh api -X GET "repos/${{ github.repository }}/actions/artifacts" \
                          -f name="ci-stage$N-$TREE" -f per_page=5 \
                          --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)
                if [ "${FOUND:-0}" -gt 0 ]; then
                  RUN=false
                  echo "stage $N: already passed on this code (marker ci-stage$N-$TREE)"
                fi
              fi
            fi
            [ "$RUN" = true ] && echo "stage $N: RUNS in this workflow"
            echo "stage$N=$RUN" >> "$GITHUB_OUTPUT"
          done

  # ════════════════════════ STAGE 1 · integration ════════════════════════════

  # ── Lint ────────────────────────────────────────────────────────────────────
  # Its own job so it reports independently of pytest.
  lint:
    needs: plan
    if: needs.plan.outputs.stage1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Keyed on this workflow: the job installs flake8 and nothing else.
          cache-dependency-path: .github/workflows/ci.yml

      - run: pip install flake8

      # Ignore pre-existing cosmetic style issues across the codebase while keeping
      # checks for the things that matter: undefined names (F821), syntax errors.
      - name: flake8
        run: |
          flake8 routes/ src/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,F401,W291,W293,W391,E302,E303,E305,E401,E127,E128,E123,E221,E225,E241,E711,E712,E722,E741,F811,F841,W504 \
            --exclude=src/services/ollama_service.py

  # ── Backend tests (everything except `slow` and `proctor`) ──────────────────
  backend:
    needs: plan
    if: needs.plan.outputs.stage1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: recruitment_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB: recruitment_test_db
      DB_PASSWORD: "1234"
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-32chars-minimum!!' }}
      DATABASE_URL: mysql+pymysql://root:1234@localhost:3306/recruitment_test_db
      HF_HOME: /tmp/hf-cache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      # Every resume score uses all-MiniLM-L6-v2, so the ATS tests here load it too.
      # Fetched up front (same cache key as stage 2) rather than downloaded mid-test.
      # --ats-only: the proctoring checks need stage 2's extras and would fail here.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /tmp/hf-cache
          key: hf-models-${{ hashFiles('backend/scripts/prefetch_models.py') }}

      - name: Fetch ATS model
        run: python scripts/prefetch_models.py --ats-only

      # The judge integration tests run real code inside hardened Docker
      # containers. ubuntu-latest HAS a Docker daemon, so docker_available() is
      # True and the skipif guards do NOT fire — if an image is missing, every
      # sandboxed test fails as RE/CE rather than skipping.
      #
      # Cached on the Dockerfiles: four uncached `docker build`s on every push
      # was the dominant cost of this workflow.
      - name: Cache judge sandbox images
        id: judge-cache
        uses: actions/cache@v4
        with:
          path: /tmp/judge-images
          key: judge-images-${{ hashFiles('backend/judge/images/Dockerfile.*') }}

      - name: Load cached judge images
        if: steps.judge-cache.outputs.cache-hit == 'true'
        run: for f in /tmp/judge-images/*.tar; do docker load -i "$f"; done

      - name: Build judge sandbox images
        if: steps.judge-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build_judge_images.sh
          mkdir -p /tmp/judge-images
          # Named explicitly rather than `docker images | grep judge`, so an
          # unrelated image on the runner can never end up in the cache.
          for lang in python cpp node java; do
            docker save "hireflow-judge-$lang:latest" -o "/tmp/judge-images/$lang.tar"
          done

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysql -h 127.0.0.1 -u root -p1234 -e "SELECT 1;" 2>/dev/null && break
            echo "Waiting for MySQL... ($i)"
            sleep 3
          done
          mysql -h 127.0.0.1 -u root -p1234 -e "CREATE DATABASE IF NOT EXISTS recruitment_test_db;"

      # The exact complement of stage 2's `-m "slow or proctor"`. The proctoring
      # files are also ignored, not just deselected: they skip at IMPORT time
      # without opencv, before the marker filter applies, and would show up here
      # as skips. Every test in them is marked `proctor`, so stage 2 runs them.
      - name: pytest (stage 1 selection)
        run: >-
          pytest test/ -v --tb=short
          -m "not slow and not proctor"
          --ignore-glob="test/test_proctor_*.py"
          --junit-xml=test-results.xml

      - name: No unapproved skips
        run: python scripts/ci_check_skips.py test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ── Migrations ──────────────────────────────────────────────────────────────
  # conftest.py builds the schema with Base.metadata.create_all, so the backend
  # job never runs a single migration — a green suite says nothing about whether
  # `alembic upgrade head` works. That gap shipped a missing column that only
  # surfaced as "Unknown column resume_pool.profile_source" against a real
  # database.
  #
  # DO NOT "simplify" this to `alembic upgrade head` on the empty service
  # database. It cannot work, and the reason is documented at
  # docs/CPANEL_DEPLOYMENT.md:702 — the first revision has no parent but its
  # first statement is `CREATE INDEX ... ON interviews`. Alembic was adopted
  # AFTER the schema already existed, so the chain only records changes since
  # then; there is no create_table for the base schema anywhere in it. On an
  # empty database it fails immediately with "Table 'interviews' doesn't exist".
  #
  # So this reproduces what a real deploy does instead:
  #   1. build the schema as `main` has it   (create_all + stamp — the documented
  #      bootstrap at CPANEL_DEPLOYMENT.md:715-745)
  #   2. apply THIS branch's new revisions on top
  #   3. check the result against the models with the same schema_diff.py gate
  #      the deploy uses
  #
  # When a branch adds no migrations, step 2 is a no-op and step 3 still runs.
  migrations:
    needs: plan
    if: needs.plan.outputs.stage1 == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: hireflow_migrations
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-test-secret-key-32chars-minimum!!
      DATABASE_URL: mysql+pymysql://root:1234@localhost:3306/hireflow_migrations
      # The service container already created the database. Left at its default
      # of 1, init_db() would also attempt CREATE DATABASE / CREATE USER.
      DB_BOOTSTRAP: "0"

    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 1

      - name: Check out main (the released schema)
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pr/backend/requirements-ci.txt

      - run: pip install -r pr/backend/requirements-ci.txt

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysql -h 127.0.0.1 -u root -p1234 -e "SELECT 1;" 2>/dev/null && break
            sleep 3
          done

      # Two branches each adding a migration produce two heads, which otherwise
      # only fails at merge time. Catch it on the PR instead.
      - name: Exactly one Alembic head
        working-directory: pr/backend
        run: |
          alembic heads
          heads=$(alembic heads | grep -c "(head)" || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $heads — two branches added migrations in parallel."
            exit 1
          fi

      # `import main` is load-bearing, not decorative: create_all only creates
      # tables for models that have been IMPORTED, and the judge and question
      # tables live in separate modules. Importing src.models.models alone
      # silently skips them. See CPANEL_DEPLOYMENT.md:734-738.
      - name: Build the schema as main has it
        working-directory: base/backend
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import main
          from src.config.database_config_mysql import init_db, db_manager
          ok = init_db()
          info = db_manager.get_database_info()
          print('created:', ok, '| tables:', info.get('table_count'))
          "
          alembic stamp head
          alembic current

      # The step that actually earns this job: only the revisions this branch
      # adds run here, which is exactly what happens on the server.
      - name: Apply this branch's new migrations
        working-directory: pr/backend
        run: |
          alembic upgrade head
          alembic current

      # `alembic current` is not evidence the schema is right — a database can be
      # stamped at head while missing a column, silently, until a request 500s.
      - name: Schema matches the models
        working-directory: pr/backend
        run: python scripts/schema_diff.py

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    needs: plan
    if: needs.plan.outputs.stage1 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm install`, not `npm ci`: the lockfile drifts from package.json and
      # `npm ci` fails with EUSAGE (see docs/DEPLOY_UPDATE.md:139). It rewrites
      # the lockfile, which is why this must never run on the server — there it
      # dirties the tree and wedges the next `git pull`. On a disposable runner
      # checkout the rewrite is harmless.
      - run: npm install

      - name: vitest
        run: npm test

      - name: Production build
        run: npm run build

  record-stage1:
    needs: [plan, lint, backend, migrations, frontend]
    if: >-
      needs.plan.outputs.stage1 == 'true' &&
      needs.lint.result == 'success' && needs.backend.result == 'success' &&
      needs.migrations.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "stage 1 passed for tree ${{ needs.plan.outputs.tree }} (${{ github.sha }})" > marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-stage1-${{ needs.plan.outputs.tree }}
          path: marker.txt
          retention-days: 90

  # ════════════════════════ STAGE 2 · pre-release ════════════════════════════
  # The tests stage 1 deselects: `slow` (ATS accuracy against real models, LLM)
  # and `proctor` (need opencv/mediapipe and proctoring/models/*). Before this
  # stage existed, no CI run executed them at all.
  stage2:
    needs: plan
    if: needs.plan.outputs.stage2 == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "1234"
          MYSQL_DATABASE: recruitment_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB: recruitment_test_db
      DB_PASSWORD: "1234"
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-32chars-minimum!!' }}
      DATABASE_URL: mysql+pymysql://root:1234@localhost:3306/recruitment_test_db
      HF_HOME: /tmp/hf-cache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-ci-stage2.txt

      # opencv (pulled in by mediapipe as well) needs the GL and GLib runtime libs.
      - name: System libraries for opencv
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1 libglib2.0-0

      - run: pip install -r requirements-ci-stage2.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: /tmp/hf-cache
          key: hf-models-${{ hashFiles('backend/scripts/prefetch_models.py') }}

      - name: Fetch models
        run: python scripts/prefetch_models.py

      - name: Wait for MySQL
        run: |
          for i in {1..15}; do
            mysql -h 127.0.0.1 -u root -p1234 -e "SELECT 1;" 2>/dev/null && break
            echo "Waiting for MySQL... ($i)"
            sleep 3
          done
          mysql -h 127.0.0.1 -u root -p1234 -e "CREATE DATABASE IF NOT EXISTS recruitment_test_db;"

      - name: pytest (stage 2 selection)
        run: >-
          pytest test/ -v --tb=short
          -m "slow or proctor"
          --junit-xml=test-results.xml

      - name: No unapproved skips
        run: python scripts/ci_check_skips.py test-results.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-test-results
          path: backend/test-results.xml

  record-stage2:
    needs: [plan, stage2]
    if: needs.plan.outputs.stage2 == 'true' && needs.stage2.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "stage 2 passed for tree ${{ needs.plan.outputs.tree }} (${{ github.sha }})" > marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-stage2-${{ needs.plan.outputs.tree }}
          path: marker.txt
          retention-days: 90

  # ── One result for the whole run ────────────────────────────────────────────
  # The single status check to require in branch protection, and the reason a
  # skipped stage can never read as green by accident: a stage job may only be
  # skipped when `plan` decided it had already passed on this exact code.
  ci-result:
    needs: [plan, lint, backend, migrations, frontend, record-stage1, stage2, record-stage2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required stage passed
        env:
          PLAN: ${{ needs.plan.result }}
          S1: ${{ needs.plan.outputs.stage1 }}
          S2: ${{ needs.plan.outputs.stage2 }}
          R1: ${{ needs.record-stage1.result }}
          R2: ${{ needs.record-stage2.result }}
        run: |
          echo "plan=$PLAN  stage1 ran=$S1 (record=$R1)  stage2 ran=$S2 (record=$R2)"
          [ "$PLAN" = success ] || { echo "::error::plan failed"; exit 1; }
          if [ "$S1" = true ] && [ "$R1" != success ]; then echo "::error::stage 1 failed"; exit 1; fi
          if [ "$S2" = true ] && [ "$R2" != success ]; then echo "::error::stage 2 failed"; exit 1; fi
          echo "all required stages passed on this code"
