[pytest]
asyncio_mode = auto
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    auth: authentication and OTP flow tests
    admin: admin workflow tests
    hr: hr workflow tests
    candidate: candidate workflow tests
    interviewer: interviewer workflow tests
    security: security and authorization bug regression tests
    slow: tests that need real models / an LLM or take more than 5s (CI stage 2, testing branch)
    ats: ATS scoring unit tests (no DB required)
    proctor: tests that need cv2/mediapipe + proctoring/models/* (CI stage 2, testing branch)
